apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-repone
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AgustinLandriel/retail-inventory-gitops.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
