apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-routes
  namespace: monitoring
spec:
  hostnames:
    - grafana.repone.landriel.site
  parentRefs:
    - name: repone-gateway
      namespace: repone
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: monitoring-grafana, port: 80 }
