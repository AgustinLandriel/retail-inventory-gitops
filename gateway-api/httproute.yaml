apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: repone-routes
  namespace: repone
spec:
  hostnames:
    - repone.landriel.site
  parentRefs:
    - name: repone-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: frontend, port: 80 }
