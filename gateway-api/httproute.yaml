apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: repone-routes
  namespace: repone
spec:
  hostnames:
    - repone.landriel.site
  parentRefs:
    - name: repone-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/auth }
      backendRefs:
        - { name: auth-service, port: 3001 }
    - matches:
        - path: { type: PathPrefix, value: /api/catalog }
      backendRefs:
        - { name: catalog-service, port: 3002 }
    - matches:
        - path: { type: PathPrefix, value: /api/orders }
      backendRefs:
        - { name: orders-service, port: 3003 }
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: frontend, port: 80 }
