apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    name: auth-service
  namespace: repone
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          name: auth-service
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            timeoutSeconds: 5
          ports:
            - containerPort: 3001
              name: auth-service
          volumeMounts:
            - name: data
              mountPath: /app/data
          env:
            - name: PORT
              value: "3001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: JWT_SECRET

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: auth-service-pvc

---
kind: Service
apiVersion: v1
metadata:
  name: auth-service
  namespace: repone
spec:
  selector:
    app: auth-service
  type: ClusterIP
  ports:
    - name: auth-service
      port: 3001
      targetPort: 3001
